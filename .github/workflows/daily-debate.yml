name: Daily Debate

# A push to a PR branch used to start the whole pipeline twice — once for the
# push and once for the pull_request — because both triggers matched every
# path. Pushes are now watched on the default branch only; PR branches are
# covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate pipeline: lint → typecheck → unit → build → security ───────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Lint (eslint — 0 errors required)
        run: npm run lint -- --max-warnings 100

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Unit + regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (critical production vulnerabilities block the build)
        run: npm audit --omit=dev --audit-level=critical

  # ── E2E: mandatory authenticated Playwright over a production build ──────
  # The app's dual-transport SQL layer (src/lib/backend/sql.ts) talks plain
  # TCP to a Postgres service container, so CI runs the FULL authenticated
  # flow against an ephemeral database: migrate → seed → test. E2E_MOCK_AI=1
  # switches the server-side AI entries to deterministic scripted responses
  # (src/lib/aiE2eMock.ts) so the suite needs no API keys and never spends
  # tokens. Guest-mode specs still run; authenticated specs cannot silently
  # skip because E2E_DATABASE_URL is always set here.
  e2e:
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_debate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daily_debate_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daily_debate_test
      E2E_MOCK_AI: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Apply migrations and seed test users
        run: |
          node scripts/migrate.mjs
          node scripts/e2e-seed.mjs

      - name: Unit + DB invariant tests (migration 003 matchmaking runs for real)
        run: npm test

      - name: Run E2E (authenticated full-flow specs included)
        run: npx playwright test --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-debate-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
