name: Daily Debate

on:
  push:
    paths:
      - "**"
      - ".github/workflows/daily-debate.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/daily-debate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate pipeline: lint → typecheck → unit → build → security ───────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Lint (eslint — 0 errors required)
        run: npm run lint -- --max-warnings 100

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Unit + regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (critical production vulnerabilities block the build)
        run: npm audit --omit=dev --audit-level=critical

  # ── E2E: ephemeral Supabase → full-flow specs ────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start ephemeral Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: |
          supabase start
          # Wait for auth service to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:54321/auth/v1/health > /dev/null 2>&1; then
              echo "Auth service ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Apply migrations
        run: supabase db reset

      - name: Export Supabase keys to env
        run: supabase status -o env >> $GITHUB_ENV

      - name: Seed test users
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: node scripts/e2e-seed.mjs

      - name: Run full-flow E2E (AI calls intercepted at network layer)
        env:
          E2E_SUPABASE_URL: http://127.0.0.1:54321
          E2E_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: npx playwright test --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-debate-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
