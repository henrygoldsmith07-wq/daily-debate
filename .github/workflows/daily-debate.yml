name: Daily Debate

# A push to a PR branch used to start the whole pipeline twice — once for the
# push and once for the pull_request — because both triggers matched every
# path. Pushes are now watched on the default branch only; PR branches are
# covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate pipeline: lint → typecheck → unit → build → security ───────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Lint (eslint — 0 errors required)
        run: npm run lint -- --max-warnings 100

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      - name: Unit + regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (critical production vulnerabilities block the build)
        run: npm audit --omit=dev --audit-level=critical

  # ── E2E: Playwright over a production build ──────────────────────────────
  # This job used to stand up an ephemeral Supabase stack, but the app moved
  # to an owned Postgres backend and no `supabase/` project remains in the
  # repo — `supabase start` had nothing to run, and the seed step was handed
  # SUPABASE_* variables while scripts/e2e-seed.mjs reads DATABASE_URL, so it
  # exited immediately. Without E2E_DATABASE_URL the app serves guest mode and
  # the auth-gated specs skip themselves, which is the surface these
  # credential-free runs are written to cover.
  #
  # Restoring the authenticated full-flow specs needs a Postgres instance the
  # app can actually reach: src/lib/backend/sql.ts talks to Neon over HTTP, so
  # a plain Postgres service container is not enough on its own.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run E2E (guest-mode surfaces; authenticated flows skip without a backend)
        run: npx playwright test --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-debate-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
