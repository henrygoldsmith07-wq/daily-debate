name: judge-benchmark

# Continuous judge validation: the invariance/bias suite runs against real
# model APIs weekly (and on demand). A gate breach fails the run, so a judge
# regression cannot ship unnoticed. Results land in docs/judge-leaderboard.md
# and docs/latest-judge-benchmark.json (last VALID run only), while every
# attempt — including outages — is appended to docs/judge-benchmark-attempts.json.
#
# main is protected by the repository ruleset (PR + required checks verify /
# e2e / topic-pipeline, no bypass actors). The safe automated path for
# benchmark artifacts is therefore a PULL REQUEST: the artifact commit goes
# to a chore branch, a PR is opened, and it merges only after the same
# required application checks that gate product code pass over it. Bot
# convenience never bypasses product safety - it goes through it.
#
# Requires repository secrets: OPENROUTER_API_KEY (free NVIDIA Nemotron chain)
# and/or NVIDIA_API_KEY, plus the default GITHUB_TOKEN with contents:write
# and pull-requests:write.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.openpr.outputs.pr_number }}
      # Publication health is SEPARATE from benchmark health (item: a PR
      # failure is an automation failure, never a judge-quality failure):
      #   benchmark_ran   the live benchmark actually executed
      #   gates_passed    the judge quality gates held (--enforce)
      #   pr_created      the artifact PR was successfully opened
      benchmark_ran: ${{ steps.bench.outcome != 'skipped' }}
      gates_passed: ${{ steps.bench.outcome == 'success' }}
      pr_created: ${{ steps.openpr.outputs.pr_created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check fixture pack stratification (no keys needed)
        run: node scripts/judge-benchmark.mjs --pack-only
      - name: Fail fast when no judge secrets are configured
        # The live run below silently "passes" when every secret is empty —
        # that masks a secrets regression as a green validation. Gate
        # explicitly: at least one provider key must exist.
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$UNOROUTER_API_KEY" ] && [ -z "$KIRAAI_API_KEY" ]; then
            echo "::error::No judge configured — set at least one of NVIDIA_API_KEY, OPENROUTER_API_KEY, UNOROUTER_API_KEY, KIRAAI_API_KEY as repository secrets. The live judge benchmark cannot run."
            exit 1
          fi
      - name: Run live judge benchmark (full pack, gated)
        id: bench
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODELS: ${{ secrets.OPENROUTER_FALLBACK_MODELS }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          UNOROUTER_MODEL: ${{ secrets.UNOROUTER_MODEL }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          KIRAAI_MODEL: ${{ secrets.KIRAAI_MODEL }}
        run: node scripts/judge-benchmark.mjs --concurrency 3 --enforce
      - name: Open a PR carrying the refreshed validation record
        id: openpr
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # State truthfulness (enforced by the script itself): a run with NO
          # usable judge never overwrites docs/latest-judge-benchmark.json or
          # the leaderboard — it is only appended to the attempts log. The
          # zero-usable case is visible in the job log and the exit code.
          echo "pr_created=false" >> "$GITHUB_OUTPUT"
          git config user.name "judge-benchmark-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="chore/judge-benchmark-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add docs/judge-leaderboard.md docs/latest-judge-benchmark.json docs/judge-benchmark-attempts.json
          if git diff --cached --quiet; then
            echo "No changes to the validation record; nothing to propose."
            exit 0
          fi
          git commit -m "chore(judge): refresh live benchmark results"
          git push origin "$branch"
          # GUARDED PR creation: 'GitHub Actions is not permitted to create or
          # approve pull requests' is a repository-settings condition, NOT a
          # judge-quality failure. Report it honestly, leave the record on the
          # pushed branch + uploaded artifact, and keep the benchmark verdict
          # separate from the publication verdict. Branch protection is never
          # bypassed: enabling the setting (or a bot PAT) restores the PR path.
          if number=$(gh pr create --base main --head "$branch" \
            --title "chore(judge): refresh live benchmark results" \
            --body "Automated weekly judge benchmark artifact refresh. Merges only after the required application checks (verify, e2e, topic-pipeline) pass; the ruleset has no bypass actors." 2>pr-create.err \
            | grep -oE '[0-9]+$'); then
            echo "Opened validation-record PR #$number (branch $branch)"
            echo "pr_number=$number" >> "$GITHUB_OUTPUT"
            echo "pr_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Benchmark artifact PR was NOT created (automation permission, not a judge failure). Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General, or use a bot PAT. The refreshed record is on branch $branch and in the uploaded artifact."
            cat pr-create.err || true
            echo "Publication: PR not created (repository setting). Benchmark verdict: see gates_passed."
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-benchmark
          path: |
            docs/judge-leaderboard.md
            docs/latest-judge-benchmark.json
            docs/judge-benchmark-attempts.json
      - name: Summarise execution vs publication health
        if: always()
        env:
          # One glance separates the two health dimensions (item: publication
          # health must never be misread as judge quality, either direction).
          # The truth table lives in scripts/lib/benchmark-publication.mjs and
          # is unit-tested (scripts/lib/benchmark-publication.test.mjs) — this
          # step only renders it, so the summary cannot drift from the tests.
          BENCH_RAN: ${{ steps.bench.outcome != 'skipped' }}
          BENCH_GATES: ${{ steps.bench.outcome == 'success' }}
          BENCH_USABLE: ""
          ARTIFACT_UPLOADED: "true"
          PR_CREATED: ${{ steps.openpr.outputs.pr_created == 'true' }}
          PR_MERGED: ""
        run: node scripts/benchmark-publication-summary.mjs

      - name: Fail the job when gates were breached
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::error::Live judge benchmark breached its gates. The artifact PR (if any) still passes through the same required checks product code faces."
          exit 1

  merge-artifact-pr:
    needs: benchmark
    if: always() && needs.benchmark.outputs.pr_created == 'true' && needs.benchmark.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for required checks, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="${{ needs.benchmark.outputs.pr_number }}"
          # --watch blocks until every check on the PR concludes; a failed
          # required check exits non-zero and leaves the PR unmerged, so the
          # benchmark record can never land on main via a red application CI.
          gh pr checks "$number" --watch --interval 30 || { echo "::error::Required checks did not pass for the artifact PR #$number; leaving it open for a human."; exit 1; }
          gh pr merge "$number" --squash
          echo "Merged validation-record PR #$number after green checks."

