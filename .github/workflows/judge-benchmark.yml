name: judge-benchmark

# Continuous judge validation: the invariance/bias suite runs against real
# model APIs weekly (and on demand). A gate breach fails the run, so a judge
# regression cannot ship unnoticed. Results land in docs/judge-leaderboard.md
# (merged per model) and docs/latest-judge-benchmark.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run live judge benchmark (gated)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/judge-benchmark.mjs --limit 3 --concurrency 3 --enforce
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-benchmark
          path: |
            docs/judge-leaderboard.md
            docs/latest-judge-benchmark.json
