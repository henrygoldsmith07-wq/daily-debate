name: topic-generation

# Pre-generates TOMORROW's debate topic on a six-slot retry ladder that all
# targets the SAME date:
#
#   20:00  primary generation (previous evening)
#   21:30  retry 1 (later evening)
#   22:45  retry 2 (later evening)
#   23:40  last pre-midnight attempt
#   00:15  post-midnight recovery (SAME target date via the 15:00 UTC cycle
#          boundary in resolveTargetDate)
#   02:15  final availability verification before the 03:00 UTC deadline
#
# Why so early and so many: GitHub scheduled runs have been observed starting
# 4-5+ hours late, and the hard availability SLO stays 'tomorrow's topic
# stored by 03:00 UTC'. Every slot is the same idempotent pipeline (one row
# per date, replaced evidence, post-write verification), so retries cost
# nothing and buy recovery margin under platform delay; the 02:15 slot
# doubles as the last-chance write AND the deadline re-verification. If a
# delayed slot slips past midnight, the cycle-boundary date rule keeps it on
# the SAME target date until 15:00 UTC instead of silently generating the
# next cycle. A late PLATFORM start is scheduler delay, recorded as such -
# never counted as a generator failure.
#
# If this workflow still fails, the app serves curated fallbacks - the
# pipeline failing is degraded, not broken, until the 03:00 deadline passes.

on:
  schedule:
    - cron: "0 20 * * *"   # primary: previous evening
    - cron: "30 21 * * *"  # retry 1 (same target date)
    - cron: "45 22 * * *"  # retry 2 (same target date)
    - cron: "40 23 * * *"  # last pre-midnight attempt (same target date)
    - cron: "15 0 * * *"   # post-midnight recovery (same target date)
    - cron: "15 2 * * *"   # final availability verification before 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # The runtimes step resolves the observed start/creation timestamps through
  # the Actions run API. That must be granted explicitly rather than relying
  # on public-repository behaviour as an implicit dependency.
  actions: read

concurrency:
  group: topic-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.gen.outputs.outcome }}
      target_date: ${{ steps.gen.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Resolve run timestamps (Actions run API; wall-clock fallback)
        # github.run_created_at does not exist and github.run_started_at
        # expanded empty in practice (dispatch run 35464159355), so both
        # timestamps are resolved once here from the run API via
        # GITHUB_RUN_ID and reused by every consumer below. The wall clock is
        # the documented last resort.
        #
        # `created` and `start` are kept DISTINCT: the API exposes them as
        # different values (run creation vs runner start), so queue delay and
        # scheduler delay are computed from genuinely different instants
        # rather than one timestamp stored twice under two names.
        id: runtimes
        run: |
          PAYLOAD="$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          CREATED="$(printf '%s' "$PAYLOAD" | jq -r '.created_at // empty' 2>/dev/null)"
          STARTED="$(printf '%s' "$PAYLOAD" | jq -r '.run_started_at // empty' 2>/dev/null)"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [ -n "$CREATED" ] && [ "$CREATED" != "null" ] || CREATED="$NOW_UTC"
          [ -n "$STARTED" ] && [ "$STARTED" != "null" ] || STARTED="$CREATED"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "start=$STARTED" >> "$GITHUB_OUTPUT"
      - name: Validate topic-generation configuration (fail fast, no writes)
        # Runs BEFORE any generation so a missing DATABASE_URL, an
        # unreachable database, or missing tables fail loudly here instead
        # of surfacing as a silent pipeline break. Never prints secrets.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
        run: node scripts/generate-topics.mjs --check-config
      - name: Pre-generate tomorrow's topic
        id: gen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          node scripts/generate-topics.mjs | tee gen.json
          grep -o '{.*}' gen.json | tail -n 1 | tee gen-result.json
          echo "outcome=$(jq -r .outcome gen-result.json)" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -r .date gen-result.json)" >> "$GITHUB_OUTPUT"
      - name: Verify the write landed (freshness postconditions)
        # A green generation step only proves the script exited 0. Re-read
        # the production database and fail if tomorrow's topic does not
        # exist, is not unique, lacks valid provenance, or evidence escaped
        # its cap / lost its topic reference.
        id: verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET: ${{ steps.gen.outputs.target }}
        run: |
          # Guard the target output before invoking the verifier: empty or
          # malformed target outputs must never reach the freshness check.
          if ! [[ "$TARGET" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "target output missing or malformed: '$TARGET' (expected YYYY-MM-DD)" >&2
            exit 1
          fi
          node scripts/verify-topic-stored.mjs --date "$TARGET" | tee verify.json
          grep -q '"ok": true' verify.json
      - name: Persist operational evidence
        # Structured proof of this run for audits and the ops-health SLO.
        # Runs even on failure: a run that died before the verifier still has
        # a generator outcome worth keeping, and stages that never executed
        # record as explicit nulls.
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          STARTED: ${{ steps.runtimes.outputs.start }}
        run: |
          # Field mapping lives in a tested module: the generator file is
          # flat ({outcome, source, date, evidenceCards}) and so is the
          # verifier file ({targetDate, checks.evidenceCards, provenance}).
          # Reading nested .generator.* / .freshness.* paths from those files
          # was the bug that logged `target=null source=null evidence=null`
          # on an otherwise green run.
          node scripts/topic-run-evidence.mjs
      - name: Record durable run telemetry (best-effort, never fails the run)
        if: always()
        # Scheduler delay vs generator failure vs availability - persisted to
        # topic_run_log so ops health can prove each dimension from data,
        # not from the current DB row alone. Runs on FAILURE too: a run that
        # died in config validation still has a scheduledFor + actualStart,
        # and item 4 wants the delay of every scheduled run measured -
        # TARGET_DATE/OUTCOME simply record as null for the failed path.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          # Both timestamps resolved above via the Actions run API
          # (github.run_created_at does not exist and github.run_started_at
          # expanded empty in practice - see the runtimes step). Kept
          # distinct: runCreatedAt is when the run was created, runStartedAt
          # is when the runner actually began, so queue delay is real.
          RUN_CREATED_AT: ${{ steps.runtimes.outputs.created }}
          RUN_STARTED_AT: ${{ steps.runtimes.outputs.start }}
          TARGET_DATE: ${{ steps.gen.outputs.target }}
          OUTCOME: ${{ steps.gen.outputs.outcome }}
          RESULT: ${{ job.status }}
          # A skipped/never-run verify step must record as null, not "fail".
          FRESHNESS: ${{ steps.verify.outcome == 'success' && 'pass' || (steps.verify.outcome == 'failure' && 'fail' || '') }}
        # GitHub exposes no run_completed_at context while the job is still
        # running, so capture the wall clock here: completedAt and durationMs
        # (item 4) become real persisted data instead of permanent nulls in
        # topic_run_log.
        run: |
          export RUN_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Provider detail is read from the generator's own result so provider
          # health is recorded separately from topic availability. Absent on a
          # policy fallback (no provider was attempted) -> explicit null.
          export PROVIDER_ERROR="$(jq -r '.providerError // empty' gen-result.json 2>/dev/null || true)"
          export PROVIDER_ATTEMPTS="$(jq -c '.providerAttempts // empty' gen-result.json 2>/dev/null || true)"
          # If the DB itself is unavailable, the same structured evidence is
          # written here and picked up by the artifact upload below.
          export TELEMETRY_FALLBACK_PATH="${{ github.workspace }}/topic-telemetry-fallback.json"
          node scripts/record-topic-run.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topic-run-evidence-${{ github.run_id }}
          path: |
            topic-run-evidence.json
            topic-telemetry-fallback.json
          if-no-files-found: warn
