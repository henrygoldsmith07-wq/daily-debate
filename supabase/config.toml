# Daily Debate — ephemeral E2E Supabase configuration.
# Used by `supabase start` in CI and by developers running local E2E.
# A fixed jwt_secret makes anon/service_role keys deterministic across runs,
# eliminating the need to parse `supabase status` output.

project_id = "daily-debate"

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[auth]
site_url = "http://127.0.0.1:4224"
additional_redirect_urls = ["http://127.0.0.1:4224/**"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
